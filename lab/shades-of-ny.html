he beat grid\n            f = clamp((since - sbT) / flipB, 0.0, 1.0);\n            ang = easeOutBack(f) * PI;                                // snaps over, overshoots, settles\n            front = exp(-pow((since - sbT - flipB * 0.5) / (flipB * 0.9), 2.0));\n        }\n        // hand: press / pinch spins the tiles under it\n        float dh = length(cB - mW) / (sc * 0.12 * handSize);\n        float spinH = handOn * step(0.5, mouseDown) * exp(-dh * dh);\n        ang += spinH * TAU * fract(TIME * 0.9);\n        float s = cos(ang);\n        bool showB = inTrans && f >= 0.5;\n        flipShade = 0.5 + 0.5 * abs(s);\n        faceGlint = exp(-pow((abs(s) - 0.55) / 0.12, 2.0)) * step(abs(s), 0.98);\n        if (abs(s) > 0.999 && (!inTrans || showB || f <= 0.0)) {\n            if (inTrans && f <= 0.0) { Lsel = LA; continue; }            // not its turn yet: the old wall\n            break;\n        }\n        // project through the turning tile; its glazed edge shows on the leading side\n        vec2 lcl = p - cB;\n        float lx = axis < 0.5 ? lcl.x : lcl.y;\n        float bx = axis < 0.5 ? bB.x : bB.y;\n        float as = max(abs(s), 1e-3);\n        float proj = lx / as;\n        float thick = bx * 0.16 * abs(sin(ang));\n        float side = sin(ang) >= 0.0 ? 1.0 : -1.0;\n        if (abs(proj) > bx) {\n            float outer = (abs(lx) - bx * as) * side * sign(lx);\n            if (outer > 0.0 && outer < thick) { edgeHit = 1.0; }\n            back = 1.0;\n            break;\n        }\n        pe = axis < 0.5 ? cB + vec2(proj, lcl.y) : cB + vec2(lcl.x, proj);\n        Lsel = showB ? LB : LA;\n    }\n\n    // ── shade the tile ──\n    vec2 lc = tLc;\n    vec2 b = tB - tGw;\n    float aa = pxW * 1.2;\n    vec2 qd = abs(lc) - (b - tR);\n    float d = length(max(qd, 0.0)) + min(max(qd.x, qd.y), 0.0) - tR;   // rounded box SDF\n    float edgeCut = tEdge - tGw;                                     // design boundaries cut tiles too\n    float inside = smoothstep(aa, -aa, d) * smoothstep(-aa, aa, edgeCut);\n    vec2 g = max(qd.x, qd.y) > 0.0 ? normalize(max(qd, 0.0)) * sign(lc) : (qd.x > qd.y ? vec2(sign(lc.x), 0.0) : vec2(0.0, sign(lc.y)));\n\n    // per-tile motion: lift waves, tilt glints, magnet hand\n    float id = tId;\n    vec2 cw = (tC - cam) / sc;\n    float T = TIME * (0.6 + 0.4 * gLift) + audioBassTime * 0.3 * ar;\n    float wave = pow(0.5 + 0.5 * sin(dot(cw, vec2(2.3, 1.1)) * 3.0 - T * 2.2), 4.0);\n    float lift = liftAmt * (0.25 * wave + 0.6 * bassP() * ar * (0.3 + 0.7 * wave) + 0.5 * audioBeatPulse * ar * step(0.82, h11(id * 31.0 + floor(TIME * 2.0))));\n    vec2 tilt = tiltAmt * 0.18 * vec2(sin(T * 1.7 + id * 40.0 + cw.x * 4.0), cos(T * 1.3 + id * 23.0 + cw.y * 4.0));\n    tilt *= 0.35 + 0.65 * gLift + 1.5 * gBuild * gBuild;\n    float dHand = length(tC - mW) / (sc * 0.16 * handSize);\n    float mag = handOn * exp(-dHand * dHand);\n    lift += mag * 0.9;\n    tilt += mag * normalize(mW - tC + 1e-4) * 0.35;\n\n    // surface normal: pillowed edge + handmade glaze waviness + tilt\n    float tsz = min(b.x, b.y);\n    float ew = tsz * (tMat < 0.5 ? 0.055 : tMat < 1.5 ? 0.22 : 0.12);\n    float e = max(-d, 0.0);\n    float slope = pillow * exp(-e / ew) * 0.9 * (tMat > 1.5 ? 0.6 : 1.0);\n    vec2 nxy = g * slope + tilt;\n    float wv = waviness * (tMat < 0.5 ? 0.04 : tMat < 1.5 ? 0.16 : 0.06);\n    vec2 wl = lc / max(tsz, 0.05);\n    nxy += wv * vec2(sin(wl.x * 5.1 + id * 30.0) * cos(wl.y * 3.7 + id * 11.0) + 0.5 * sin(wl.y * 9.0 + id * 7.0),\n                     cos(wl.y * 4.3 + id * 19.0) * sin(wl.x * 3.1 + id * 5.0) + 0.5 * cos(wl.x * 8.0 + id * 13.0));\n    nxy += (tMat > 1.5 ? 0.05 : 0.0) * (vec2(vnoise(lc * 120.0), vnoise(lc * 120.0 + 7.0)) - 0.5);   // matte tesserae: bisque texture\n    vec3 N = normalize(vec3(nxy, 1.0));\n\n    // base colour, camera mosaic, chips, grime\n    vec3 base = tCol;\n    if (camMix > 0.001) {\n        vec2 cu = ((tC - cam) / sc) * vec2(R.y / R.x, 1.0) + 0.5;\n        vec3 cc = texture2D(camTex, clamp(bodyCamUV(cu), 0.0, 1.0)).rgb;\n        base = mix(base, cc * (0.92 + 0.12 * id), camMix);\n    }\n    float chip = chipMask(lc, b, id) * (tMat > 1.5 ? 1.0 : tMat > 0.5 ? 0.4 : 0.0);\n    base = mix(base, vec3(0.78, 0.68, 0.52), chip);                 // exposed bisque\n    float grime = wear * 0.12 * smoothstep(0.4, 1.0, vnoise(p * 1.7)) + wear * 0.25 * exp(-e / (tsz * 0.1)) * step(0.5, tMat) * step(tMat, 1.5) * 0.0;\n    base *= 1.0 - grime;\n\n    // ── light: soft top light, fluorescent tubes in reflection, train light, hand glints ──\n    vec3 V = normalize(vec3(-p0 * 0.35, 1.0));\n    vec3 Lk = normalize(vec3(-0.25, 0.65, 0.72));\n    float dif = clamp(dot(N, Lk) * 0.55 + 0.55, 0.0, 1.2);\n    float topLight = 0.9 + 0.18 * uv.y;\n    vec3 Rf = reflect(-V, N);\n    float ry = Rf.y / max(Rf.z, 0.25);\n    float rx = Rf.x / max(Rf.z, 0.25);\n    float tubeA = smoothstep(0.07, 0.0, abs(ry - 0.42 - 0.04 * sin(cam.x * 0.5))) * smoothstep(1.4, 0.3, abs(rx));\n    float tubeB = smoothstep(0.05, 0.0, abs(ry - 0.95)) * smoothstep(1.6, 0.2, abs(rx + 0.3)) * 0.7;\n    float ceilG = smoothstep(-0.2, 1.2, ry) * 0.25;\n    float fres = 0.05 + 0.95 * pow(1.0 - max(dot(N, V), 0.0), 5.0);\n    float glossK = gloss * (tMat < 0.5 ? 1.0 : tMat < 1.5 ? 1.15 : 0.22) * (1.0 - 0.8 * chip);\n    float sharp = tMat > 1.5 ? 0.3 : 1.0;\n    vec3 env = vec3(1.0, 0.98, 0.94) * ((tubeA + tubeB) * tubes * mix(0.35, 1.0, sharp) + ceilG);\n    // train light: a bright streak sweeping along the wall\n    float passT = trainEvery > 0.5 ? mod(TIME, trainEvery) / 4.0 : 9.0;\n    float trainOn = step(passT, 1.0) * smoothstep(0.0, 0.15, passT) * smoothstep(1.0, 0.8, passT);\n    float tx = mix(2.2, -2.2, passT) * (R.x / R.y);\n    float trainSp = smoothstep(0.35, 0.0, abs(rx - tx)) * smoothstep(-0.6, 0.6, ry) * trainOn;\n    env += trainColor.rgb * trainSp * 1.6;\n    // highs: glints jump between tiles\n    float glint = highP() * ar * step(0.9, h11(id * 51.0 + floor(TIME * 8.0))) * pow(max(dot(N, normalize(Lk + V)), 0.0), 60.0);\n    vec3 lit = base * dif * topLight * (0.9 + 0.35 * lift) * (tMat < 0.5 ? 1.16 : 1.0);\n    lit = mix(lit, lit * 0.25 + env, clamp(glossK * (0.06 + 0.9 * fres) * (tMat > 0.5 && tMat < 1.5 ? 2.2 : 1.0), 0.0, 1.0) * 0.85);\n    lit += env * glossK * 0.18 * sharp + vec3(1.0) * glint * 1.5 * gloss;\n    // hand: a soft lamp under the palm\n    float hl = mag * 0.25;\n    lit += vec3(1.0, 0.96, 0.9) * hl * (base * 0.6 + pow(max(dot(N, normalize(vec3(mW - tC, 0.4))), 0.0), 40.0) * glossK);\n    lit *= flipShade;\n    lit += vec3(1.0, 0.97, 0.92) * faceGlint * gloss * 0.9;             // the face catches the tubes as it turns\n\n    // ── grout: the grid between the tiles, with light running through it ──\n    float gd = max(d, -edgeCut);                                     // >0 in the grout\n    vec3 groutC = tGrout * (0.85 + 0.15 * vnoise(p * 9.0)) * (1.0 - 0.3 * wear * vnoise(p * 2.3));\n    // shadow of a lifted tile falls into the grout (down-right)\n    float sh = smoothstep(0.0, tsz * 0.35 * (0.3 + lift), gd) ;\n    groutC *= mix(0.55, 1.0, sh) * (1.0 - 0.35 * lift);\n    float runPos = abs(lc.x) > abs(lc.y) * (b.x / max(b.y, 1e-3)) ? p.y : p.x;\n    float runner = pow(0.5 + 0.5 * sin(runPos * 2.2 - TIME * (1.5 + 5.0 * gBuild) * (0.6 + 0.4 * gLift) + id * 2.0), 12.0);\n    float gGlow = gridGlow * (0.35 * runner + 0.9 * audioBeatPulse * ar + 1.2 * gDrop + 0.5 * gBuild * runner + 2.2 * front);\n    vec3 groutLit = groutC * (0.75 + 0.3 * topLight) + glowColor.rgb * gGlow;\n\n    vec3 col = mix(groutLit, lit, inside);\n    vec3 bg = backdrop(uv);\n    if (back > 0.5) col = bg * 0.7 + glowColor.rgb * gridGlow * 0.35 * front;   // the empty bed behind a turning tile\n    if (edgeHit > 0.5) col = vec3(0.86, 0.8, 0.7) * (0.6 + 0.4 * flipShade) + vec3(0.2) * faceGlint;   // glazed edge\n    float alpha = transparentBg ? (back > 0.5 ? 0.0 : inside) : 1.0;\n\n    // show lift, drop flash, vignette, grain\n    col *= 0.86 + 0.24 * gLift;\n    col += vec3(1.0, 0.95, 0.85) * gDrop * gDrop * 0.12;\n    vec2 dc = uv - 0.5;\n    col *= 1.0 - 0.25 * smoothstep(0.4, 1.0, length(dc * vec2(R.x / R.y, 1.0)));\n    col += (h12(fc + fract(TIME * 13.7) * 91.0) - 0.5) * 0.015;\n    col += (h12(fc * 1.03 + fract(TIME * 7.1) * 57.0) + h12(fc * 0.97 + 11.0) - 1.0) * (1.5 / 255.0);\n    col = studioPalette(clamp(col, 0.0, 1.0));\n    gl_FragColor = vec4(clamp(col, 0.0, 1.0), alpha);\n}\n", "assets": {}}, "ny_metro": {"name": "Metro", "num": "1603", "sn": "004", "src": "/*{\n  \"DESCRIPTION\": \"Metro — Shades of New York 004. A living map of the New York subway, seen by a camera that orbits and tours over the city. The city is drawn from real coordinates: Manhattan on its true 29° street grid with Central Park, the Bronx, Queens and Brooklyn across the East River, the Rockaways around Jamaica Bay, Staten Island across the harbour, the Jersey shore, Randall's, Roosevelt, Governors, Liberty and Rikers islands, the big parks and both airports. The trunk lines follow their real routes through their real stations (Broadway–7th Av from Van Cortlandt to South Ferry, Lexington to Woodlawn and Pelham Bay, 8th Av to Inwood and out to the Rockaways, 6th Av to Coney Island, Queens Blvd to Jamaica, Broadway to Astoria and Bay Ridge, the Flushing line, the crosstown, 14th St to Canarsie, the Jamaica line and the Staten Island Railway), drawn in the line colours: the west-side red, the east-side green, the 8th Avenue blue, the 6th Avenue orange, the Broadway yellow, the purple Flushing line, the lime crosstown, the grey 14th Street line, the brown Jamaica line and the Staten Island railway. Every line has two tracks and the trains never stop: lit cars with headlights in front and tail lights behind leave streaks of light along the tracks, and stations flash as a train pulls through. Streets carry tiny moving traffic lights and the water shimmers. Colours change here and there: Colour Drift lets lines trade colours now and then, and the themes go from Night Map and Day Map to Neon, Blueprint and Ink on Paper. Camera: Orbit spins slowly around the city while the tour glides between Manhattan, Brooklyn and Queens; Tilt lowers the camera from straight down to a skyline-height view, and Zoom pulls from the whole city into the streets. Camera friendly: put an image or the live camera under the map. Body tracking (MediaPipe pose + segmentation) turns you into a subway line: your skeleton is drawn over the city as a glowing line in trunk-line colours (red spine, yellow shoulders and hips, green arms, blue legs) with trains running along your limbs and a station at every joint, while the map lights up and shows the camera inside your silhouette. Your mouse, or your hand in ShaderClaw, lights the district under it; press or pinch to send a pulse racing out through the tracks. Audio: bass makes the trains glow and the lines breathe, beats send a ring of light out from Times Square through the network, mids drive train speed, highs make the stations twinkle. Show dynamics: at Rest the city is dim, the trains slow and the camera high and still; the Build speeds every train up, brightens the network, spins the camera faster and lowers it toward the streets; the Drop flashes the whole network in a shockwave out of Midtown with a camera punch; the Peak runs the system at full rush hour.\",\n  \"CREDIT\": \"Easel / ShaderClaw house shader — Shades of New York series, 2026-11-11 — original schematic, not the official map.\",\n  \"CATEGORIES\": [\"Generator\", \"Shades of New York\", \"Map\", \"3D\", \"Interactive\", \"Audio Reactive\"],\n  \"INPUTS\": [\n    { \"NAME\": \"theme\",       \"LABEL\": \"Theme\", \"TYPE\": \"long\", \"DEFAULT\": 0, \"VALUES\": [0, 1, 2, 3, 4], \"LABELS\": [\"Night Map\", \"Day Map\", \"Neon\", \"Blueprint\", \"Ink on Paper\"], \"GROUP\": \"Look\" },\n    { \"NAME\": \"colourDrift\", \"LABEL\": \"Colour Drift\",     \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.0, \"GROUP\": \"Look\" },\n    { \"NAME\": \"hueShift\",    \"LABEL\": \"Hue Shift\",        \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.0, \"GROUP\": \"Look\" },\n    { \"NAME\": \"lineWidth\",   \"LABEL\": \"Line Width\",       \"TYPE\": \"float\", \"MIN\": 0.15, \"MAX\": 2.5, \"DEFAULT\": 0.45, \"GROUP\": \"Look\" },\n    { \"NAME\": \"glowAmt\",     \"LABEL\": \"Glow\",             \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 2.0, \"DEFAULT\": 0.55, \"GROUP\": \"Look\" },\n    { \"NAME\": \"streets\",     \"LABEL\": \"Streets & Traffic\",\"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.5, \"DEFAULT\": 0.7, \"GROUP\": \"Look\" },\n    { \"NAME\": \"landTint\",    \"LABEL\": \"Land Tint\",        \"TYPE\": \"color\", \"DEFAULT\": [1.0, 1.0, 1.0, 1.0], \"GROUP\": \"Look\" },\n    { \"NAME\": \"waterTint\",   \"LABEL\": \"Water Tint\",       \"TYPE\": \"color\", \"DEFAULT\": [1.0, 1.0, 1.0, 1.0], \"GROUP\": \"Look\" },\n    { \"NAME\": \"trainSpeed\",  \"LABEL\": \"Train Speed\",      \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 3.0, \"DEFAULT\": 1.0, \"GROUP\": \"Trains\" },\n    { \"NAME\": \"trainDensity\",\"LABEL\": \"Trains Per Line\",  \"TYPE\": \"float\", \"MIN\": 0.3, \"MAX\": 3.0, \"DEFAULT\": 1.0, \"GROUP\": \"Trains\" },\n    { \"NAME\": \"trailAmt\",    \"LABEL\": \"Light Trails\",     \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.5, \"DEFAULT\": 0.8, \"GROUP\": \"Trains\" },\n    { \"NAME\": \"stationFlash\",\"LABEL\": \"Station Flash\",    \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.5, \"DEFAULT\": 0.8, \"GROUP\": \"Trains\" },\n    { \"NAME\": \"spin\",        \"LABEL\": \"Orbit Spin\",       \"TYPE\": \"float\", \"MIN\": -1.0, \"MAX\": 1.0, \"DEFAULT\": 0.3, \"GROUP\": \"Camera\" },\n    { \"NAME\": \"tilt\",        \"LABEL\": \"Tilt\",             \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.55, \"GROUP\": \"Camera\" },\n    { \"NAME\": \"zoomAmt\",     \"LABEL\": \"Zoom\",             \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.45, \"GROUP\": \"Camera\" },\n    { \"NAME\": \"tour\",        \"LABEL\": \"City Tour\",        \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.6, \"GROUP\": \"Camera\" },\n    { \"NAME\": \"interact\",    \"LABEL\": \"Hand\", \"TYPE\": \"long\", \"DEFAULT\": 1, \"VALUES\": [0, 1], \"LABELS\": [\"Off\", \"Light + Pulse (press / pinch)\"], \"GROUP\": \"Hand\" },\n    { \"NAME\": \"bodyMode\",    \"LABEL\": \"Body Tracking\", \"TYPE\": \"long\", \"DEFAULT\": 3, \"VALUES\": [0, 1, 2, 3], \"LABELS\": [\"Off\", \"Silhouette (the city lights up inside you)\", \"Skeleton (your body is a subway line)\", \"Both\"], \"GROUP\": \"Body\" },\n    { \"NAME\": \"bodyMirror\",  \"LABEL\": \"Mirror (selfie view)\", \"TYPE\": \"bool\", \"DEFAULT\": true, \"GROUP\": \"Body\" },\n    { \"NAME\": \"bodyLineW\",   \"LABEL\": \"Body Line Width\",  \"TYPE\": \"float\", \"MIN\": 0.2, \"MAX\": 3.0, \"DEFAULT\": 0.6, \"GROUP\": \"Body\" },\n    { \"NAME\": \"bodyCamMix\",  \"LABEL\": \"Camera Inside You\", \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.35, \"GROUP\": \"Body\" },\n    { \"NAME\": \"camTex\",      \"LABEL\": \"Image / Camera\",   \"TYPE\": \"image\", \"GROUP\": \"Camera Input\" },\n    { \"NAME\": \"camMix\",      \"LABEL\": \"Image Under Map\",  \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.0, \"GROUP\": \"Camera Input\" },\n    { \"NAME\": \"paletteMode\", \"LABEL\": \"Studio Palette\", \"TYPE\": \"long\", \"DEFAULT\": 4, \"VALUES\": [0, 1, 2, 3, 4], \"LABELS\": [\"Colorful\", \"Red · Black · White\", \"Blue · Black · White\", \"Black & White\", \"NYC Reference\"], \"GROUP\": \"Studio Palette\" },\n    { \"NAME\": \"palAmount\",   \"LABEL\": \"Palette Amount\",   \"TYPE\": \"float\", \"AUDIO\": false, \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 1.0, \"GROUP\": \"Studio Palette\" },\n    { \"NAME\": \"palRed\",      \"LABEL\": \"Red Accent\",       \"TYPE\": \"color\", \"DEFAULT\": [0.92, 0.04, 0.07, 1.0], \"GROUP\": \"Studio Palette\" },\n    { \"NAME\": \"palBlue\",     \"LABEL\": \"Blue Accent\",      \"TYPE\": \"color\", \"DEFAULT\": [0.07, 0.32, 1.0, 1.0],  \"GROUP\": \"Studio Palette\" },\n    { \"NAME\": \"audioReact\",  \"LABEL\": \"Audio React\",      \"TYPE\": \"float\", \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.65, \"GROUP\": \"Audio Reactivity\" },\n    { \"NAME\": \"showState\",   \"LABEL\": \"Show State\", \"TYPE\": \"long\", \"DEFAULT\": 0, \"VALUES\": [0, 1, 2, 3], \"LABELS\": [\"Follow Music\", \"Rest\", \"Build\", \"Peak\"], \"GROUP\": \"Show Dynamics\" },\n    { \"NAME\": \"dynamics\",    \"LABEL\": \"Build & Drop Depth\", \"TYPE\": \"float\", \"AUDIO\": false, \"MIN\": 0.0, \"MAX\": 1.0, \"DEFAULT\": 0.85, \"GROUP\": \"Show Dynamics\" },\n    { \"NAME\": \"bgMode\",      \"LABEL\": \"Sky\", \"TYPE\": \"long\", \"DEFAULT\": 1, \"VALUES\": [0, 1, 2], \"LABELS\": [\"Solid\", \"Vertical Gradient\", \"Radial Gradient\"], \"GROUP\": \"Background\" },\n    { \"NAME\": \"bgColor\",     \"LABEL\": \"BG Color / Top / Center\", \"TYPE\": \"color\", \"DEFAULT\": [0.01, 0.012, 0.03, 1.0], \"GROUP\": \"Background\" },\n    { \"NAME\": \"bgColor2\",    \"LABEL\": \"BG Bottom / Edge\", \"TYPE\": \"color\", \"DEFAULT\": [0.08, 0.06, 0.1, 1.0], \"GROUP\": \"Background\" },\n    { \"NAME\": \"transparentBg\",\"LABEL\": \"Transparent BG (lines only)\", \"TYPE\": \"bool\", \"DEFAULT\": false, \"GROUP\": \"Background\" }\n  ],\n  \"PASSES\": [\n    { \"TARGET\": \"netBuf\", \"FLOAT\": true },\n    {}\n  ]\n}*/\n\n// ─────────────────────────────────────────────────────────────────────────\n// Metro — Shades of New York 004\n//   pass 0  netBuf: a 16×16 corner of texels holds the network. Texel (i, L)\n//           = control point i of line L (x, y, arc length so far, 1);\n//           texel (15, L) = that line's bounding box. netPt() (the line\n//           table) is evaluated only here, from one call site.\n//   pass 1  the map: an orbiting pinhole camera hits the city plane; every\n//           pixel finds its nearest track (bounding boxes skip far lines),\n//           then draws land, water, streets, lines, trains and stations.\n// ─────────────────────────────────────────────────────────────────────────\n\n#define PI  3.14159265359\n#define TAU 6.28318530718\n#define NL 18\n\nfloat h11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }\nfloat h12(vec2 p)  { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }\nvec2  h21(float p) { vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }\nfloat bassP() { return smoothstep(0.05, 0.85, audioBass); }\nfloat midP()  { return smoothstep(0.08, 0.85, audioMid); }\nfloat highP() { return smoothstep(0.08, 0.9, audioHigh); }\nfloat lum(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }\n\nvec3 studioPalette(vec3 c) {\n    float m = float(paletteMode);\n    if (palAmount <= 0.0 || m > 3.5) return c;                     // NYC Reference = the photo's own colours\n    float L = clamp(lum(c), 0.0, 1.0);\n    float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));\n    float sat = mx > 1e-4 ? (mx - mn) / mx : 0.0;\n    vec3 o;\n    if (m < 0.5) {\n        vec3 hueC = pow((c - mn) / max(mx - mn, 1e-4), vec3(1.4));\n        float s2 = 1.0 - pow(1.0 - sat, 4.0);\n        float v = clamp(pow(mx, 0.85) * 1.12, 0.0, 1.0);\n        o = mix(vec3(1.0), hueC, s2) * v;\n        float hx = L * 1.7 + 0.04 * TIME;\n        vec3 neon = pow(clamp(abs(fract(hx + vec3(0.0, 0.6667, 0.3333)) * 6.0 - 3.0) - 1.0, 0.0, 1.0), vec3(1.4));\n        float wn = (1.0 - smoothstep(0.02, 0.1, sat)) * smoothstep(0.06, 0.25, L) * (1.0 - smoothstep(0.55, 0.85, L));\n        o = mix(o, neon * v, wn);\n        o = mix(o, vec3(1.0), smoothstep(0.85, 1.0, L) * 0.5);\n    } else if (m > 2.5) {\n        o = vec3(smoothstep(0.02, 0.95, pow(L, 0.9)));\n    } else {\n        vec3 acc = m < 1.5 ? palRed.rgb : palBlue.rgb;\n        float t = pow(L, 0.8);\n        vec3 ramp = t < 0.5 ? mix(vec3(0.0), acc, t * 2.0) : mix(acc, vec3(1.0), (t - 0.5) * 2.0);\n        vec3 mono = vec3(smoothstep(0.0, 1.0, L));\n        o = mix(mono, ramp, smoothstep(0.06, 0.4, sat));\n    }\n    return mix(c, o, palAmount);\n}\nvec3 backdrop(vec2 uv) {\n    float m = float(bgMode);\n    if (m < 0.5) return bgColor.rgb;\n    if (m < 1.5) return mix(bgColor2.rgb, bgColor.rgb, smoothstep(0.0, 1.0, uv.y));\n    vec2 dd = (uv - 0.5) * vec2(RENDERSIZE.x / RENDERSIZE.y, 1.0);\n    return mix(bgColor.rgb, bgColor2.rgb, smoothstep(0.0, 0.85, length(dd)));\n}\n\n// ── Show dynamics: rest → build → peak / drop ───────────────────────────\nfloat gRest, gBuild, gPeak, gDrop, gLift;\nvoid showDynamics() {\n    float m = float(showState);\n    float e = clamp(audioEnergy, 0.0, 1.0);\n    float b = clamp(audioBuildup, 0.0, 1.0);\n    float d = clamp(audioDrop, 0.0, 1.0);\n    if (m > 0.5) {\n        if (m < 1.5)      { e = 0.04; b = 0.0; d = 0.0; }\n        else if (m < 2.5) { float r = fract(TIME / 8.0); e = 0.3 + 0.35 * r; b = r * r; d = 0.0; }\n        else              { e = 1.0; b = 0.0; d = exp(-fract(TIME / 4.0) * 5.0); }\n    }\n    float k = dynamics;\n    gBuild = b * k;\n    gDrop  = d * k;\n    gPeak  = smoothstep(0.5, 0.9, e) * k;\n    gRest  = (1.0 - smoothstep(0.08, 0.4, e)) * (1.0 - b) * k;\n    gLift  = mix(0.5, clamp(0.15 + e * 0.7 + gBuild * 0.25 + d * 0.3, 0.0, 1.0), k);\n}\n\n\nvec2 h22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }\nfloat vnoise(vec2 x) {\n    vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);\n    return mix(mix(h12(i), h12(i + vec2(1, 0)), f.x), mix(h12(i + vec2(0, 1)), h12(i + vec2(1, 1)), f.x), f.y);\n}\nvec3 hueRot(vec3 c, float h) {\n    if (h <= 0.0) return c;\n    float a = h * TAU; vec3 k = vec3(0.57735); float ca = cos(a);\n    return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);\n}\n\n// ── Body layer (MediaPipe, ShaderClaw contract) ─────────────────────────\n//   mpPoseLandmarks: 33×1 RGBA8 per joint (x, 1 − y, z + 0.5, visibility), x as the camera sees it\n//   mpSegMask:       selfie-segmentation confidence (r), row 0 = top of the camera image\n//   Both come from the host (ShaderClaw web MediaPipe / Easel vision); unfed = zeros = no body.\n//   Joints and the mask are mirrored for a selfie view when Mirror is on, and every shader\n//   samples its camera image through bodyCamUV() so picture, mask and skeleton line up.\nvec2 bodyCamUV(vec2 uv) { return vec2(bodyMirror ? 1.0 - uv.x : uv.x, uv.y); }\nvec3 bodyJoint(float i) {                       // (uv.x, uv.y, visibility)\n    vec4 lm = texture2D(mpPoseLandmarks, vec2((i + 0.5) / 33.0, 0.5));\n    return vec3(bodyMirror ? 1.0 - lm.r : lm.r, lm.g, lm.a);\n}\nfloat bodySeg(vec2 uv) {\n    vec2 s = vec2(bodyMirror ? 1.0 - uv.x : uv.x, 1.0 - uv.y);\n    return smoothstep(0.35, 0.65, texture2D(mpSegMask, clamp(s, 0.0, 1.0)).r);\n}\n// how sure we are there is a body (shoulders + hips visible)\nfloat bodyPresence() {\n    float v = bodyJoint(11.0).z + bodyJoint(12.0).z + bodyJoint(23.0).z + bodyJoint(24.0).z;\n    return smoothstep(1.2, 2.6, v);\n}\nfloat bodyUseSkel() { float m = float(bodyMode); return (m > 1.5) ? 1.0 : 0.0; }          // Skeleton or Both\nfloat bodyUseSil()  { float m = float(bodyMode); return (m > 0.5 && m < 1.5) || m > 2.5 ? 1.0 : 0.0; }   // Silhouette or Both\n// distance (screen-height units, p-space) from p to the skeleton's bones; gBoneT = 0..1 along the nearest bone\nfloat gBoneT, gBoneId;\nfloat boneSeg(vec2 p, vec3 a, vec3 b, float asp, float id, float best) {\n    if (a.z < 0.4 || b.z < 0.4) return best;\n    vec2 A = (a.xy - 0.5) * vec2(asp, 1.0), B = (b.xy - 0.5) * vec2(asp, 1.0);\n    vec2 pa = p - A, ba = B - A;\n    float h = clamp(dot(pa, ba) / max(dot(ba   vec3 landC = gLand * (0.9 + 0.12 * vnoise(c * 6.0)) * (0.88 + 0.2 * smoothstep(0.0, -0.05, ld));\n        landC = mix(landC, gPark, smoothstep(aa, -aa, parkSD(c)) * 0.9);\n        landC = mix(landC, mix(landC, gStreet, 0.6) * 1.05, smoothstep(aa, -aa, airportSD(c)) * 0.8);\n        if (camMix > 0.001) {\n            vec3 ci = texture2D(camTex, uv).rgb;\n            landC = mix(landC, ci * (dark ? 0.55 : 1.0), camMix);\n            water = mix(water, ci * (dark ? 0.25 : 0.7), camMix * 0.6);\n        }\n        // streets: Manhattan's tight grid, a looser grid elsewhere; tiny traffic lights move along them\n        float inM = smoothstep(0.01, -0.02, gManh);\n        // Manhattan's grid runs 29° east of north: avenues ~250 m apart, streets ~80 m\n        vec2 sg = inM > 0.5 ? (mat2(0.8746, 0.4848, -0.4848, 0.8746) * c) * vec2(1.0 / 0.025, 1.0 / 0.0075) : (c * mat2(0.96, -0.28, 0.28, 0.96)) / 0.016;\n        vec2 sf = abs(fract(sg) - 0.5);\n        float lw = fp / (inM > 0.5 ? 0.0075 : 0.016) * 0.9;\n        float st = max(smoothstep(lw + 0.04, 0.0, 0.5 - sf.x), smoothstep(lw + 0.04, 0.0, 0.5 - sf.y));\n        st *= streets * land * smoothstep(0.03, 0.12, fp < 0.004 ? 1.0 : 0.004 / fp);\n        vec2 cell = floor(sg);\n        float dashA = step(0.93, fract(sg.y * 1.0 + TIME * (0.6 + h12(cell.xx)) * 1.5 + h12(cell.xx + 3.0)));\n        float dashB = step(0.93, fract(sg.x * 1.0 - TIME * (0.6 + h12(cell.yy)) * 1.5 + h12(cell.yy + 5.0)));\n        float traffic = (smoothstep(0.12, 0.02, 0.5 - sf.x) * dashA + smoothstep(0.12, 0.02, 0.5 - sf.y) * dashB) * streets * land * step(fp, 0.004);\n        landC = mix(landC, gStreet, st * 0.8);\n        // coastline: a crisp edge + a soft drop shadow over the water\n        float coast = smoothstep(aa * 1.5 + 0.002, 0.0, abs(ld));\n        vec3 base = mix(water * (1.0 - 0.35 * exp(-max(ld, 0.0) / 0.012)), landC, land);\n        base = mix(base, gCoast, coast * 0.75);\n        base += (dark ? vec3(1.0, 0.82, 0.55) : vec3(0.9, 0.2,       float lightUp = beatRing * 1.2 + shock * 2.0 + handPulse * 1.5 + 0.6 * gPeak * bassP() * ar;\n        float handLamp = handOn * exp(-dM * dM / 0.012);\n\n        // glow halo\n        float glow = exp(-d / (glowR * 0.35)) * glowAmt * (dark ? 0.55 : 0.18) * (0.55 + 0.45 * gLift + lightUp);\n        base += lc * glow * (neon ? 1.6 : 1.0);\n\n        // the line itself: a slightly raised tube with two tracks\n        float tube = 1.0 - pow(clamp(abs(lat) / w, 0.0, 1.0), 2.0);\n        vec3 lineCol = lc * (0.72 + 0.35 * tube) * (dark ? 0.85 : 1.0);\n        float rail = smoothstep(fp * 1.2, 0.0, abs(abs(lat) - w * 0.45)) * step(fp, w * 0.25);\n        lineCol = mix(lineCol, lineCol * 0.6, rail * 0.5);\n        lineCol += lc * lightUp * 0.8 + vec3(1.0) * shock * 0.5;\n        vec3 caseC = dark ? vec3(0.0) : vec3(1.0);\n        if (gThemeLines > 1.5) { caseC = gLand; lineCol = vec3(0.07) + lc * lightUp; }\n        base = mix(base, caseC, casing * 0.85);\n        base = mix(base, lineCol, lineM);\n\n        // trains on both tracks: lit cars, headlights, tail lights, light trails\n        float dir = lat >= 0.0 ? 1.0 : -1.0;\n        vec4 tr = trains(gNs, dir, L);\n        float lane = smoothstep(w * 0.95, w * 0.75, abs(lat)) * smoothstep(0.0, w * 0.12, abs(lat));\n        float car = smoothstep(0.0, 0.06, fract(tr.y * 5.0)) * smoothstep(1.0, 0.94, fract(tr.y * 5.0));\n        vec3 carC = mix(vec3(1.0), lc, 0.35) * (1.2 + 0.8 * bassP() * ar + lightUp);\n        float body = tr.x * lane * mix(0.75, 1.0, car);\n        base = mix(base, carC, body);\n        base += vec3(1.0, 0.95, 0.8) * tr.x * smoothstep(0.85, 1.0, tr.y) * lane * 1.5;           // headlight cab\n        base += vec3(1.0, 0.95, 0.8) * exp(-tr.z / 0.02) * lane * 0.9 * step(tr.x, 0.5);           // beam ahead\n        base += vec3(1.0, 0.1, 0.05) * tr.x * smoothstep(0.12, 0.0, tr.y) * lane * 0.9;            // tail lights\n        base += lc * exp(-tr.w / (0.09 * trailAmt + 1e-3)) * lane * trailAmt * 0.9 * step(tr.x, 0.5); // light trail\n        base += lc * glowAmt * 0.6 * tr.x * exp(-d / (w * 2.0)) * (dark ? 1.0 : 0.3);              // train glow\n\n        // stations: dots along every line, flashing as trains pull through\n        float sp = 0.065;\n        float so = h11(L * 2.3) * sp;\n        float sk = floor((gNs + so) / sp);\n        float sC = sk * sp + 0.5 * sp - so;\n        float su = gNs - sC;\n        float sr = w * 0.62;\n        float sd = length(vec2(su, d));\n        float sMask = smoothstep(sr + aa, sr - aa, sd) * step(0.02, sC) * step(fp, w * 1.2);\n        vec4 tA = trains(sC, 1.0, L), tB = trains(sC, -1.0, L);\n        float flash = max(tA.x, tB.x) * stationFlash;\n        float twinkle = highP() * ar * step(0.8, h11(sk * 7.1 + L * 3.0 + floor(TIME * 10.0)));\n        vec3 stC = dark ? vec3(0.95) : vec3(1.0);\n        stC += (lc * 0.8 + 0.6) * (flash + twinkle);\n        float ring = smoothstep(sr * 0.55 + aa, sr * 0.55 - aa, sd);\n        base = mix(base, gThemeLines > 1.5 ? vec3(0.07) : vec3(0.02), sMask);\n        base = mix(base, stC, ring * sMask);\n        base += lc * flash * exp(-sd / (w * 1.5)) * 0.5 * (dark ? 1.0 : 0.4);\n\n        // the hand lights its district\n        base += (dark ? vec3(0.35, 0.3, 0.25) : vec3(0.1)) * handLamp + lc * handLamp * exp(-d / 0.02) * 0.6;\n\n        // depth: fog toward the horizon, show lift\n        float fog = smoothstep(dist * 1.2, dist * 3.2, t);\n        col = mix(base * (0.82 + 0.3 * gLift), bg, fog);\n        alpha = transparentBg ? clamp(max(lineM, glow) + body, 0.0, 1.0) * (1.0 - fog) : 1.0;\n    }\n\n    // ── body layer: your silhouette lights the city, your skeleton is a subway line ──\n    float bodyOn = (float(bodyMode) > 0.5 && PASSINDEX == 1) ? smoothstep(0.3, 0.7, bodyPresence()) : 0.0;\n    if (bodyOn > 0.01) {\n        float asp = R.x / R.y;\n        if (bodyUseSil() > 0.5) {\n            float m = bodySeg(uv);\n            vec3 camC = texture2D(camTex, clamp(bodyCamUV(uv), 0.0,             float st = smoothstep(sr + pxs, sr - pxs, jd);\n            float stIn = smoothstep(sr * 0.6 + pxs, sr * 0.6 - pxs, jd);\n            col = mix(col, vec3(0.02), st * bodyOn);\n            col = mix(col, vec3(1.0) * (1.0 + audioBeatPulse * ar * stationFlash), stIn * bodyOn);\n        }\n    }\n    col += vec3(0.9, 0.95, 1.0) * gDrop * gDrop * 0.08;\n    vec2 dc = uv - 0.5;\n    col *= 1.0 - 0.3 * smoothstep(0.35, 1.0, length(dc * vec2(R.x / R.y, 1.0)));\n    col += (h12(fc + fract(TIME * 13.7) * 91.0) - 0.5) * 0.012;\n    col += (h12(fc * 1.03 + fract(TIME * 7.1) * 57.0) + h12(fc * 0.97 + 11.0) - 1.0) * (1.5 / 255.0);\n    col = studioPalette(clamp(col, 0.0, 1.0));\n    gl_FragColor = vec4(clamp(col, 0.0, 1.0), alpha);\n}\n", "assets": {}}};
const TRANS = {"NY_BeatSlices": "// Name: NY Beat Slices\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// Horizontal bands slide across in alternating directions, each band moving in clean jumps\n// (steps = beats in the transition), so the cut lands with the music. B rides in behind A.\nuniform float bands; // = 8.0\nuniform float steps; // = 8.0\n\nvec4 transition(vec2 uv) {\n  float n = max(bands, 1.0);\n  float row = floor(uv.y * n);\n  float dir = mod(row, 2.0) < 0.5 ? 1.0 : -1.0;\n  float st = max(steps, 1.0);\n  float q = (floor(progress * st) + smoothstep(0.0, 0.3, fract(progress * st))) / st;   // jump on each beat\n  float stagger = (row / n) * 0.3;\n  float t = clamp((q - stagger) / 0.7, 0.0, 1.0);\n  float off = t * dir;\n  vec2 ua = vec2(uv.x - off, uv.y);\n  vec2 ub = vec2(uv.x - off + dir, uv.y);\n  vec3 col;\n  if (ua.x >= 0.0 && ua.x <= 1.0) col = getFromColor(ua).rgb;\n  else col = getToColor(clamp(ub, 0.0, 1.0)).rgb;\n  // a bright seam where the two pictures meet, a dark hairline between bands\n  float seamX = dir > 0.0 ? off : 1.0 + off;\n  col += vec3(1.0) * exp(-pow((uv.x - seamX) * 120.0, 2.0)) * step(0.01, t) * step(t, 0.99) * (0.4 + 0.6 * audioBeat);\n  col *= 1.0 - 0.6 * step(fract(uv.y * n), 0.008);\n  return vec4(col, 1.0);\n}\n", "NY_FlowMorph": "// Name: NY Flow Morph\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A morph rather than a cross-fade. Each picture is read at three softened scales, broad\n// shapes first and finer forms after, and pushed along the difference between them: A's\n// pixels flow toward where their brightness sits in B, and B flows back from where it was in\n// A. The hand-off happens in the middle under a soft bloom, so forms melt and re-form.\nuniform float strength; // = 1.0\n\nfloat fmL(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }\nfloat fmA(vec2 uv, float r) { return (fmL(getFromColor(uv + vec2(r, r)).rgb) + fmL(getFromColor(uv + vec2(-r, r)).rgb) + fmL(getFromColor(uv + vec2(r, -r)).rgb) + fmL(getFromColor(uv - vec2(r, r)).rgb)) * 0.25; }\nfloat fmB(vec2 uv, float r) { return (fmL(getToColor(uv + vec2(r, r)).rgb) + fmL(getToColor(uv + vec2(-r, r)).rgb) + fmL(getToColor(uv + vec2(r, -r)).rgb) + fmL(getToColor(uv - vec2(r, r)).rgb)) * 0.25; }\n\nvec4 transition(vec2 uv) {\n  float t = progress;\n  float bell = sin(t * 3.14159);\n  vec2 flowV = vec2(0.0);\n  float w = 1.0;\n  for (int i = 0; i < 3; i++) {\n    float s = 0.05 / pow(2.0, float(i));                       // 0.05, 0.025, 0.0125 \u2014 broad first\n    float diff = fmB(uv, s) - fmA(uv, s);\n    vec2 g = vec2(fmB(uv + vec2(s, 0.0), s) - fmB(uv - vec2(s, 0.0), s) + fmA(uv + vec2(s, 0.0), s) - fmA(uv - vec2(s, 0.0), s),\n                  fmB(uv + vec2(0.0, s), s) - fmB(uv - vec2(0.0, s), s) + fmA(uv + vec2(0.0, s), s) - fmA(uv - vec2(0.0, s), s));\n    flowV += g * diff * w * s * 3.0;\n    w *= 0.55;\n  }\n  flowV *= strength * (1.0 + 0.6 * audioBass);\n  float lf = length(flowV);\n  flowV *= min(1.0, 0.07 / max(lf, 1e-5));                      // never tear the picture apart\n  vec3 A = getFromColor(uv + flowV * t * 4.0).rgb;\n  vec3 B = getToColor(uv - flowV * (1.0 - t) * 4.0).rgb;\n  float m = smoothstep(0.32, 0.68, t);\n  vec3 col = mix(A, B, m);\n  vec3 soft = (getFromColor(uv + vec2(0.012, 0.0)).rgb + getToColor(uv - vec2(0.012, 0.0)).rgb + getFromColor(uv + vec2(0.0, 0.012)).rgb + getToColor(uv - vec2(0.0, 0.012)).rgb) * 0.25;\n  col += soft * soft * bell * 0.3;\n  return vec4(col, 1.0);\n}\n", "NY_InkBleed": "// Name: NY Ink Bleed\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// B spreads into A like ink into wet paper: it blooms out of a few fixed points (centre first,\n// then the corners), the edge feathers through the paper fibres and leaves a dark tide line.\nuniform vec4 inkRim; // = vec4(0.05, 0.04, 0.06, 1.0)\n\nfloat ibHash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }\nfloat ibNoise(vec2 x) { vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);\n  return mix(mix(ibHash(i), ibHash(i + vec2(1, 0)), f.x), mix(ibHash(i + vec2(0, 1)), ibHash(i + vec2(1, 1)), f.x), f.y); }\n\nvec4 transition(vec2 uv) {\n  vec2 p = uv * vec2(ratio, 1.0);\n  float fib = ibNoise(p * 6.0) * 0.5 + ibNoise(p * 17.0) * 0.3 + ibNoise(p * 50.0) * 0.2;\n  // distance to the nearest bloom point, each starting a little later than the last\n  vec2 c0 = vec2(0.5 * ratio, 0.5);\n  float d = length(p - c0);\n  d = min(d, length(p - vec2(0.12 * ratio, 0.85)) + 0.25);\n  d = min(d, length(p - vec2(0.88 * ratio, 0.15)) + 0.25);\n  d = min(d, length(p - vec2(0.85 * ratio, 0.88)) + 0.4);\n  d = min(d, length(p - vec2(0.15 * ratio, 0.12)) + 0.4);\n  float front = progress * (length(vec2(ratio, 1.0)) * 0.7 + 0.5);\n  float v = d + (fib - 0.5) * 0.18 - front;\n  float m = smoothstep(0.02, -0.02, v);\n  float rim = exp(-pow(v / 0.012, 2.0)) * (1.0 - progress * 0.5);\n  vec3 col = mix(getFromColor(uv).rgb, getToColor(uv).rgb, m);\n  col = mix(col, inkRim.rgb, rim * 0.75);\n  col *= 1.0 - 0.15 * smoothstep(0.08, 0.0, abs(v)) * (1.0 - m);     // wet halo darkens the paper ahead\n  return vec4(col, 1.0);\n}\n", "NY_Iris": "// Name: NY Iris\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A camera aperture: polygonal iris blades close over A (rotating as they go, with a lens\n// fringe and a glow on the edge), and reopen onto B. The blades snap shut on the beat.\nuniform float blades; // = 7.0\n\nvec4 transition(vec2 uv) {\n  vec2 p = (uv - 0.5) * vec2(ratio, 1.0);\n  float n = max(blades, 3.0);\n  float r = length(p);\n  float closing = progress < 0.5 ? 1.0 - progress * 2.0 : progress * 2.0 - 1.0;   // 1 open \u2192 0 shut \u2192 1 open\n  float ease = closing * closing * (3.0 - 2.0 * closing);\n  float rot = (1.0 - ease) * 1.2 * (progress < 0.5 ? 1.0 : -1.0);\n  float a = atan(p.y, p.x) + rot;\n  float seg = 6.2831853 / n;\n  float polyR = r * cos(mod(a, seg) - seg * 0.5);                      // distance to a regular polygon edge\n  float R = ease * length(vec2(ratio, 1.0)) * 0.6 * (1.0 + 0.04 * audioBeat);\n  vec4 scene = progress < 0.5 ? getFromColor(uv) : getToColor(uv);\n  float inside = smoothstep(R + 0.004, R - 0.004, polyR);\n  // blades: dark brushed metal with a lit rim\n  float rim = exp(-pow((polyR - R) / 0.01, 2.0));\n  vec3 blade = vec3(0.05, 0.05, 0.06) + vec3(0.12) * fract(a / seg + r * 3.0) * 0.4;\n  // lens fringe inside the aperture edge\n  vec2 dir = normalize(p + 1e-5);\n  float fr = smoothstep(R, R * 0.85, polyR) * (1.0 - smoothstep(R * 0.85, R * 0.6, polyR));\n  vec3 fringe = vec3((progress < 0.5 ? getFromColor(uv + dir * 0.006) : getToColor(uv + dir * 0.006)).r, scene.g,\n                     (progress < 0.5 ? getFromColor(uv - dir * 0.006) : getToColor(uv - dir * 0.006)).b);\n  vec3 col = mix(scene.rgb, fringe, fr * 0.8);\n  col = mix(blade, col, inside) + vec3(1.0, 0.9, 0.75) * rim * 0.6;\n  return vec4(col, 1.0);\n}\n", "NY_LumaMorph": "// Name: NY Luma Morph\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A morph led by the pictures themselves: B's brightest forms surface first and spread into\n// its shadows while A's dark areas sink away. Brightness is read from a softened copy of each\n// picture, so whole shapes lead (not pixel noise), and both images drift along their own broad\n// brightness slopes so forms melt into each other. A glow rides the moving boundary.\nuniform float flow; // = 0.035\nuniform float softness; // = 0.24\n\nfloat lmL(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }\nfloat lmSoftA(vec2 uv, float r) {\n  return (lmL(getFromColor(uv).rgb) * 2.0 + lmL(getFromColor(uv + vec2(r, 0.0)).rgb) + lmL(getFromColor(uv - vec2(r, 0.0)).rgb)\n        + lmL(getFromColor(uv + vec2(0.0, r)).rgb) + lmL(getFromColor(uv - vec2(0.0, r)).rgb)) / 6.0;\n}\nfloat lmSoftB(vec2 uv, float r) {\n  return (lmL(getToColor(uv).rgb) * 2.0 + lmL(getToColor(uv + vec2(r, 0.0)).rgb) + lmL(getToColor(uv - vec2(r, 0.0)).rgb)\n        + lmL(getToColor(uv + vec2(0.0, r)).rgb) + lmL(getToColor(uv - vec2(0.0, r)).rgb)) / 6.0;\n}\n\nvec4 transition(vec2 uv) {\n  float r = 0.03, e = 0.035;\n  float bell = sin(progress * 3.14159);\n  vec2 gA = vec2(lmSoftA(uv + vec2(e, 0.0), r) - lmSoftA(uv - vec2(e, 0.0), r), lmSoftA(uv + vec2(0.0, e), r) - lmSoftA(uv - vec2(0.0, e), r));\n  vec2 gB = vec2(lmSoftB(uv + vec2(e, 0.0), r) - lmSoftB(uv - vec2(e, 0.0), r), lmSoftB(uv + vec2(0.0, e), r) - lmSoftB(uv - vec2(0.0, e), r));\n  float fl = flow * (1.0 + 0.8 * audioBass) * bell;\n  vec3 A = getFromColor(uv - gB * fl * 6.0).rgb;\n  vec3 B = getToColor(uv + gA * fl * 6.0).rgb;\n  float key = mix(lmSoftB(uv, r * 1.5), 1.0 - lmSoftA(uv, r * 1.5), 0.3);\n  float t = progress * (1.0 + 2.0 * softness) - softness;\n  float m = smoothstep(1.0 - t - softness, 1.0 - t + softness, key);\n  float edge = exp(-pow((key - (1.0 - t)) / max(softness * 0.3, 0.01), 2.0)) * bell;\n  vec3 col = mix(A, B, m) + mix(A, B, 0.5) * edge * 0.45;\n  return vec4(col, 1.0);\n}\n", "NY_Mosaic": "// Name: NY Mosaic\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A sets into mosaic: the picture coarsens into glazed tesserae with grout (the tiles bevel\n// and catch the light), the tesserae turn over to B's colours ring by ring from the centre,\n// then the mosaic refines back into the full picture of B.\nuniform float coarse; // = 26.0\nuniform float steps; // = 0.0\n\nvec4 transition(vec2 uv) {\n  float prog = progress;\n  if (steps > 0.5) prog = (floor(progress * steps) + smoothstep(0.0, 0.3, fract(progress * steps))) / steps;\n  // resolution: full \u2192 coarse \u2192 full (in powers that read as deliberate steps)\n  float k = sin(prog * 3.14159);\n  float n = mix(400.0, max(coarse, 4.0), pow(k, 0.6));\n  vec2 asp = vec2(ratio, 1.0);\n  vec2 g = uv * asp * n;\n  vec2 id = floor(g), lc = fract(g) - 0.5;\n  vec2 cuv = (id + 0.5) / n / asp;\n  vec2 rv = cuv - 0.5;\n  float ring = length(rv * asp) / (0.5 * length(asp));\n  float flip = smoothstep(ring * 0.6 + 0.2, ring * 0.6 + 0.32, prog);   // centre first\n  vec3 a = getFromColor(cuv).rgb, b = getToColor(cuv).rgb;\n  vec3 tile = mix(a, b, flip);\n  float tileK = smoothstep(80.0, 30.0, n);                                // tile look only when coarse\n  float bev = smoothstep(0.5, 0.35, max(abs(lc.x), abs(lc.y)));\n  vec2 nrm = lc * (1.0 - bev) * 2.0;\n  float light = 1.0 + dot(nrm, vec2(-0.5, 0.6)) * 0.6;\n  float grout = smoothstep(0.42, 0.48, max(abs(lc.x), abs(lc.y)));\n  vec3 mosaic = mix(tile * light, vec3(0.08, 0.075, 0.07), grout);\n  mosaic += vec3(1.0) * pow(max(0.0, 1.0 - length(lc - vec2(-0.2, 0.22)) * 4.0), 3.0) * 0.25;   // glaze glint\n  vec3 full = prog < 0.5 ? getFromColor(uv).rgb : getToColor(uv).rgb;\n  vec3 col = mix(n > 300.0 ? full : tile, mosaic, tileK);\n  col *= 1.0 + 0.15 * audioBeat * tileK;\n  return vec4(col, 1.0);\n}\n", "NY_ScanRoll": "// Name: NY Scan Roll\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// An old station CRT losing hold: the picture rolls, splits into red / green / blue, tears\n// on the scanlines and snows, then locks back onto B.\nvec4 transition(vec2 uv) {\n  float bell = sin(progress * 3.14159);\n  float roll = progress * 2.0;\n  vec2 u = vec2(uv.x + 0.02 * bell * sin(uv.y * 80.0 + progress * 40.0), fract(uv.y + roll * bell));\n  float split = 0.012 * bell * (1.0 + audioBeat);\n  vec3 A = vec3(getFromColor(u + vec2(split, 0.0)).r, getFromColor(u).g, getFromColor(u - vec2(split, 0.0)).b);\n  vec3 B = vec3(getToColor(u + vec2(split, 0.0)).r, getToColor(u).g, getToColor(u - vec2(split, 0.0)).b);\n  vec3 col = progress < 0.5 ? A : B;\n  float snow = fract(sin(dot(floor(uv * vec2(320.0, 240.0)) + floor(progress * 60.0), vec2(12.9898, 78.233))) * 43758.5453);\n  col = mix(col, vec3(snow), bell * bell * 0.35);\n  col *= 0.85 + 0.15 * sin(uv.y * 900.0);\n  col += vec3(1.0) * exp(-pow((fract(uv.y - progress * 3.0) - 0.5) / 0.01, 2.0)) * bell * 0.3;\n  return vec4(col, 1.0);\n}\n", "NY_Shatter": "// Name: NY Shatter\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A breaks like a pane of glass: Voronoi shards crack from the impact point (the centre, hit\n// on the beat), then fall away under gravity, spinning and catching the light on their edges,\n// revealing B behind.\nuniform float shards; // = 9.0\n\nvec2 shH(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }\n\nvec4 transition(vec2 uv) {\n  vec2 asp = vec2(ratio, 1.0);\n  vec2 p = uv * asp * max(shards, 2.0);\n  // nearest shard seed (3\u00d73 search)\n  vec2 ip = floor(p), fp = fract(p);\n  float d1 = 9.0, d2 = 9.0; vec2 best = vec2(0.0);\n  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {\n    vec2 o = vec2(float(i), float(j));\n    vec2 pt = o + shH(ip + o);\n    float d = length(pt - fp);\n    if (d < d1) { d2 = d1; d1 = d; best = ip + o; } else if (d < d2) d2 = d;\n  }\n  vec2 cen = (best + shH(best)) / max(shards, 2.0) / asp;              // shard centre (uv)\n  float dist = length((cen - 0.5) * asp);\n  float crack = smoothstep(0.0, 0.25, progress);\n  float fall = clamp((progress - 0.15 - dist * 0.35) / 0.55, 0.0, 1.0);\n  fall = fall * fall;\n  float spin = (shH(best).x - 0.5) * 6.0 * fall;\n  vec2 drop = vec2((shH(best).y - 0.5) * 0.3, -1.6) * fall;\n  // move this pixel back into the shard's rest frame\n  vec2 rel = (uv - cen - drop) * asp;\n  float c = cos(-spin), s = sin(-spin);\n  rel = mat2(c, -s, s, c) * rel;\n  vec2 src = cen + rel / asp;\n  // is the source point still inside the same shard?\n  vec2 sp = src * asp * max(shards, 2.0);\n  vec2 sip = floor(sp), sfp = fract(sp);\n  float sd1 = 9.0; vec2 sbest = vec2(0.0);\n  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {\n    vec2 o = vec2(float(i), float(j));\n    float d = length(o + shH(sip + o) - sfp);\n    if (d < sd1) { sd1 = d; sbest = sip + o; }\n  }\n  vec3 B = getToColor(uv).rgb;\n  if (fall > 0.0 && (length(sbest - best) > 0.1 || src.x < 0.0 || src.x > 1.0 || src.y < 0.0 || src.y > 1.0)) return vec4(B, 1.0);\n  vec3 A = getFromColor(src).rgb;\n  float edge = smoothstep(0.06, 0.0, d2 - d1);\n  vec3 col = A * (1.0 - 0.25 * fall) + vec3(0.9, 0.95, 1.0) * edge * crack * (0.4 + 0.6 * abs(sin(spin)) + audioBeat * 0.4);\n  return vec4(col, 1.0);\n}\n", "NY_SplitFlap": "// Name: NY Split-Flap\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A station departures board. The picture is cut into flaps; row by row from the top, each\n// flap's upper half falls over its hinge (showing B on its back) with a little bounce, the way\n// a Solari board clacks over. steps quantises the rows onto the beat.\nuniform float rows; // = 9.0\nuniform float cols; // = 14.0\nuniform float steps; // = 0.0\n\nfloat sfBounce(float x) { return 1.0 - abs(cos(x * 3.14159 * 1.5)) * (1.0 - x) * (1.0 - x) * 0.9 - (1.0 - x) * 0.1 * (1.0 - x); }\n\nvec4 transition(vec2 uv) {\n  float R = max(rows, 1.0), C = max(cols, 1.0);\n  vec2 cell = vec2(floor(uv.x * C), floor((1.0 - uv.y) * R));          // row 0 = top\n  vec2 lc = vec2(fract(uv.x * C), 1.0 - fract((1.0 - uv.y) * R));       // 0..1 in the flap, y up\n  float prog = progress;\n  if (steps > 0.5) prog = (floor(progress * steps) + smoothstep(0.0, 0.25, fract(progress * steps))) / steps;\n  float st = (cell.y / R) * 0.7 + (cell.x / C) * 0.08;\n  float f = clamp((prog - st) / 0.22, 0.0, 1.0);\n  vec4 A = getFromColor(uv), B = getToColor(uv);\n  vec3 gap = vec3(0.02);\n  float seam = smoothstep(0.0, 0.02, abs(lc.y - 0.5)) * smoothstep(0.0, 0.03, lc.x) * smoothstep(1.0, 0.97, lc.x);\n  if (f <= 0.0) return vec4(A.rgb * mix(0.7, 1.0, seam), 1.0);\n  if (f >= 1.0) return vec4(B.rgb * mix(0.7, 1.0, seam), 1.0);\n  // static halves: top shows B (revealed), bottom shows A until the flap lands\n  float ang = sfBounce(f) * 3.14159;                                  // 0 \u2192 \u03c0: the upper flap falls\n  float c = cos(ang);\n  vec3 col;\n  if (lc.y >= 0.5) {\n    col = B.rgb * 0.85;                                                // revealed top behind the flap\n    if (c > 0.0) {                                                     // flap still above the hinge\n      float h = 0.5 + (lc.y - 0.5) / max(c, 0.001);\n      if (h <= 1.0) {\n        vec2 suv = vec2(uv.x, (cell.y < 0.0 ? 0.0 : (R - cell.y - 1.0 + h) / R));\n        col = getFromColor(suv).rgb * (0.6 + 0.4 * c);\n      }\n    }\n  } else {\n    col = A.rgb;\n    if (c < 0.0) {                                                     // flap below the hinge: shows B's lower half\n      float h = 0.5 - (0.5 - lc.y) / max(-c, 0.001);\n      if (h >= 0.0) {\n        vec2 suv = vec2(uv.x, (R - cell.y - 1.0 + h) / R);\n        col = getToColor(suv).rgb * (0.65 + 0.35 * -c);\n      }\n    }\n    col *= 1.0 - 0.35 * (1.0 - abs(c)) * step(0.0, c);                  // the falling flap's shadow\n  }\n  return vec4(col * mix(0.7, 1.0, seam), 1.0);\n}\n", "NY_SprayOver": "// Name: NY Spray Over\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A writer buffs the wall: a fat-cap spray front sweeps across A laying down paint with soft\n// overspray and flying specks, then a second pass sprays B in through the fresh paint, its\n// edge a ragged spray stencil. Highs add specks, beats puff the cloud.\nuniform vec4 paint; // = vec4(0.92, 0.93, 0.95, 1.0)\n\nfloat spHash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }\nfloat spNoise(vec2 x) { vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);\n  return mix(mix(spHash(i), spHash(i + vec2(1, 0)), f.x), mix(spHash(i + vec2(0, 1)), spHash(i + vec2(1, 1)), f.x), f.y); }\nfloat spFbm(vec2 p) { return spNoise(p) * 0.55 + spNoise(p * 2.1 + 3.1) * 0.3 + spNoise(p * 4.7 + 7.0) * 0.15; }\n\nvec4 transition(vec2 uv) {\n  vec2 p = uv * vec2(ratio, 1.0);\n  float wob = (spFbm(p * 3.0) - 0.5) * 0.35 + 0.08 * sin(uv.y * 9.0);\n  // pass 1: paint covers A; pass 2: B sprayed in through the paint\n  float f1 = smoothstep(0.0, 0.55, progress) * 1.5 - 0.25;\n  float f2 = smoothstep(0.4, 1.0, progress) * 1.5 - 0.25;\n  float x = uv.x + wob;\n  float paintM = smoothstep(f1 + 0.08, f1 - 0.04, x);\n  float bM = smoothstep(f2 + 0.06, f2 - 0.06, x + (spFbm(p * 9.0) - 0.5) * 0.12);\n  // overspray: a soft cloud ahead of each front, and flying specks\n  float cloud1 = exp(-pow((x - f1) / 0.07, 2.0)) * 0.6 * (1.0 + audioBeat);\n  float specks = step(0.985 - 0.02 * audioHigh, spHash(floor(uv * vec2(ratio, 1.0) * 400.0) + floor(progress * 30.0))) * exp(-pow((x - f1) / 0.15, 2.0));\n  vec3 A = getFromColor(uv).rgb, B = getToColor(uv).rgb;\n  vec3 col = mix(A, paint.rgb, clamp(paintM + cloud1 * 0.6 + specks, 0.0, 1.0));\n  col = mix(col, B, bM);\n  // a wet sheen on fresh paint\n  col += vec3(0.08) * paintM * (1.0 - bM) * smoothstep(0.4, 0.9, spFbm(p * 6.0 + progress));\n  return vec4(col, 1.0);\n}\n", "NY_SubwayDoors": "// Name: NY Subway Doors\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// Stainless-steel train doors slide shut over A, hold for a beat, then open onto B. Brushed\n// steel with a vertical grain, a window in each leaf showing the scene behind, rubber edge\n// seals that meet in the middle, and a bump when they close (the bass kicks the bump).\nuniform float hold; // = 0.14\nuniform vec4 steelTint; // = vec4(0.72, 0.74, 0.78, 1.0)\n\nfloat sdHash(vec2 p) { return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }\nfloat sdNoise(float x) { float i = floor(x), f = fract(x); return mix(sdHash(vec2(i, 0.0)), sdHash(vec2(i + 1.0, 0.0)), f * f * (3.0 - 2.0 * f)); }\n\nvec4 transition(vec2 uv) {\n  float a = (1.0 - hold) * 0.5;\n  float close = smoothstep(0.0, a, progress);\n  float open = smoothstep(a + hold, 1.0, progress);\n  // closing eases in hard and bumps; opening glides\n  float shut = close * close * (3.0 - 2.0 * close);\n  float bump = exp(-pow((progress - a) / 0.03, 2.0)) * (0.012 + 0.02 * audioBass);\n  float cover = shut * (1.0 - open * open * (3.0 - 2.0 * open));       // 0 open \u2026 1 closed\n  vec4 scene = progress < a + hold * 0.5 ? getFromColor(uv) : getToColor(uv);\n  float half_ = 0.5 * cover;\n  float x = uv.x - 0.5;\n  float onLeft = step(-0.5, x) * step(x, -0.5 + half_ + bump);\n  float onRight = step(0.5 - half_ - bump, x) * step(x, 0.5);\n  if (onLeft + onRight < 0.5) return scene;\n  // door-local coordinates: 0 at the leading (rubber) edge\n  float lead = onLeft > 0.5 ? (-0.5 + half_ + bump) - x : x - (0.5 - half_ - bump);\n  vec2 dp = vec2(lead * ratio, uv.y);\n  // brushed steel: vertical grain + soft reflections\n  float grain = sdNoise(uv.y * 900.0 + floor(uv.x * 400.0) * 13.0) * 0.06 + sdNoise(uv.y * 60.0 + 3.0) * 0.05;\n  float sheen = 0.18 * smoothstep(0.0, 0.5, uv.y) * smoothstep(1.0, 0.6, uv.y);\n  vec3 steel = steelTint.rgb * (0.78 + grain + sheen) * (0.92 + 0.08 * uv.y);\n  // the window: a rounded rectangle showing the blurred scene behind\n  vec2 wc = vec2(0.17 * ratio, 0.66);\n  vec2 wq = abs(dp - wc) - vec2(0.09 * ratio, 0.17);\n  float wd = length(max(wq, 0.0)) + min(max(wq.x, wq.y), 0.0) - 0.02;\n  float win = smoothstep(0.003, -0.003, wd);\n  vec3 behind = (getFromColor(uv + vec2(0.004, 0.0)).rgb + getFromColor(uv - vec2(0.004, 0.0)).rgb) * 0.5;\n  behind = progress > a + hold * 0.5 ? (getToColor(uv + vec2(0.004, 0.0)).rgb + getToColor(uv - vec2(0.004, 0.0)).rgb) * 0.5 : behind;\n  vec3 glass = behind * 0.7 + vec3(0.05, 0.06, 0.07) + vec3(0.25) * smoothstep(0.3, 0.0, abs(dp.x - wc.x + dp.y * 0.3 - 0.2));\n  vec3 col = mix(steel, glass, win);\n  col *= 1.0 - 0.5 * smoothstep(0.012, 0.0, abs(wd));                  // window gasket\n  // rubber seal at the leading edge, and the dark recess shadow where the leaves meet\n  float seal = smoothstep(0.012, 0.006, lead);\n  col = mix(col, vec3(0.04), seal);\n  col *= 1.0 - 0.3 * smoothstep(0.06, 0.0, lead) * (1.0 - seal);\n  return vec4(col, 1.0);\n}\n", "NY_TileFlip": "// Name: NY Tile Flip\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// The screen is a wall of square tiles. Rings of tiles flip from the centre outward, each\n// turning in perspective over its vertical axis: A on the front, B on the back. Tiles lift\n// and shade as they turn, glint when they face the light, show their glazed edge, and land\n// with a small overshoot. steps > 0 quantises the wave into that many beats.\nuniform float tiles; // = 10.0\nuniform float flipShare; // = 0.35\nuniform float steps; // = 0.0\nuniform vec4 groutColor; // = vec4(0.06, 0.055, 0.05, 1.0)\n\nfloat tfHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nfloat tfBack(float x) { float c1 = 1.7, c3 = c1 + 1.0, y = x - 1.0; return 1.0 + c3 * y * y * y + c1 * y * y; }\n\nvec4 transition(vec2 uv) {\n  vec2 asp = vec2(ratio, 1.0);\n  float n = max(tiles, 2.0);\n  vec2 g = uv * asp * n;\n  vec2 id = floor(g);\n  vec2 lc = fract(g) - 0.5;\n  vec2 cen = (id + 0.5) / n / asp;                          // tile centre in uv\n  // choreography: rings of tiles from the centre, on the beat grid\n  vec2 ringV = (id + 0.5) - 0.5 * n * asp;\n  float ring = max(abs(ringV.x) / asp.x, abs(ringV.y));\n  float sn = clamp(ring / (0.5 * n) , 0.0, 1.0);\n  float prog = progress;\n  if (steps > 0.5) prog = (floor(progress * steps) + smoothstep(0.0, 0.35, fract(progress * steps))) / steps;\n  float f = clamp((prog - sn * (1.0 - flipShare)) / flipShare, 0.0, 1.0);\n  float ang = tfBack(f) * 3.14159265;\n  float c = cos(ang), s = sin(ang);\n  float sx = max(abs(c), 0.001);\n  // perspective: the receding edge shrinks vertically\n  float persp = 1.0 + 0.25 * s * lc.x * sign(c);\n  vec2 q = vec2(lc.x / sx, lc.y * persp);\n  float kick = audioBeat * 0.04 * s;\n  q *= 1.0 + kick;\n  float inFace = step(abs(q.x), 0.47) * step(abs(q.y), 0.47);\n  vec2 suv = cen + q / n / asp;\n  vec4 colA = getFromColor(clamp(suv, 0.0, 1.0));\n  vec4 colB = getToColor(clamp(suv, 0.0, 1.0));\n  vec4 face = f < 0.5 ? colA : colB;\n  // light: darker as the tile turns away, a glint as it passes the light, edges brighter\n  float shade = 0.55 + 0.45 * sx;\n  float glint = exp(-pow((abs(c) - 0.6) / 0.1, 2.0)) * step(0.02, f) * step(f, 0.98);\n  float bevel = smoothstep(0.47, 0.40, max(abs(q.x), abs(q.y)));\n  vec3 col = face.rgb * shade * mix(0.82, 1.0, bevel) + vec3(1.0, 0.97, 0.92) * glint * 0.35;\n  // the glazed edge on the leading side, and the dark bed behind a turning tile\n  float edgeW = 0.06 * s;\n  float edge = step(0.47 * sx, abs(lc.x)) * step(abs(lc.x), 0.47 * sx + edgeW) * step(abs(lc.y), 0.47);\n  vec3 bed = groutColor.rgb * (1.0 + 2.0 * s * (1.0 - f) * f);\n  vec3 outCol = mix(bed, col, inFace);\n  outCol = mix(outCol, vec3(0.86, 0.82, 0.74) * shade, edge * (1.0 - inFace));\n  // untouched tiles show the plain image with hairline grout; settled tiles too\n  float grout = step(0.485, max(abs(lc.x), abs(lc.y)));\n  if (f <= 0.0) return vec4(mix(colA.rgb, groutColor.rgb, grout * 0.7 * step(0.001, progress)), 1.0);\n  if (f >= 1.0) return vec4(mix(colB.rgb, groutColor.rgb, grout * 0.7 * step(progress, 0.999)), 1.0);\n  return vec4(outCol, 1.0);\n}\n", "NY_TrainPass": "// Name: NY Train Pass\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A train blows through the frame: lit cars with windows and gaps between them rush past\n// left to right, the air around them smears the picture, and when the last car clears, the\n// next scene is standing there. Bass shakes the cars.\nuniform float cars; // = 3.0\nuniform vec4 bodyTint; // = vec4(0.55, 0.57, 0.6, 1.0)\nuniform vec4 lineColor; // = vec4(0.93, 0.21, 0.18, 1.0)\n\nvec4 transition(vec2 uv) {\n  float len = max(cars, 1.0) * 1.15;                                     // train length in screen widths\n  float head = mix(-0.05, 1.0 + len, progress * progress * (3.0 - 2.0 * progress));\n  float tail = head - len;\n  float x = uv.x;\n  // the picture behind: A ahead of the train, B behind it, smeared by the wind near the cars\n  float near = smoothstep(0.25, 0.0, min(abs(x - head), abs(x - tail)));\n  vec2 blur = vec2(0.03 * near, 0.0);\n  vec3 A = (getFromColor(uv).rgb + getFromColor(uv - blur).rgb + getFromColor(uv - 2.0 * blur).rgb) / 3.0;\n  vec3 B = (getToColor(uv).rgb + getToColor(uv + blur).rgb + getToColor(uv + 2.0 * blur).rgb) / 3.0;\n  vec3 scene = x > head ? A : B;\n  float shake = (audioBass * 0.01 + 0.003) * sin(progress * 180.0);\n  float y = uv.y + shake;\n  float onTrain = step(tail, x) * step(x, head) * step(0.12, y) * step(y, 0.88);\n  if (onTrain < 0.5) return vec4(scene, 1.0);\n  float cx = (x - tail) / len * max(cars, 1.0);\n  float carI = floor(cx), cf = fract(cx);\n  float gap = step(cf, 0.03) + step(0.97, cf);\n  if (gap > 0.5) return vec4(scene * 0.3, 1.0);\n  // car body: ribbed steel, a line-colour stripe, a row of lit windows with passengers\n  float rib = 0.9 + 0.1 * sin(y * 420.0);\n  vec3 body = bodyTint.rgb * rib * (0.85 + 0.25 * smoothstep(0.12, 0.88, y));\n  float stripe = step(0.3, y) * step(y, 0.34);\n  body = mix(body, lineColor.rgb, stripe);\n  float wx = fract(cf * 6.0);\n  float win = step(0.15, wx) * step(wx, 0.85) * step(0.45, y) * step(y, 0.72);\n  vec3 inside = vec3(1.0, 0.95, 0.82) * 0.9;\n  float person = step(0.5, fract(sin((carI * 6.0 + floor(cf * 6.0)) * 12.9898) * 43758.5)) * smoothstep(0.08, 0.0, abs(wx - 0.5) - 0.1) * step(y, 0.66);\n  inside = mix(inside, vec3(0.15, 0.13, 0.12), person * 0.8);\n  vec3 col = mix(body, inside, win);\n  // doors, motion streaks, and the headlight glare on the leading car\n  col *= 1.0 - 0.4 * step(abs(fract(cf * 2.0) - 0.5), 0.004);\n  col += vec3(0.2) * pow(0.5 + 0.5 * sin(y * 90.0 + progress * 60.0), 40.0);\n  col += vec3(1.0, 0.95, 0.8) * smoothstep(0.02, 0.0, head - x) * 1.5;\n  return vec4(col, 1.0);\n}\n", "NY_ZoomPunch": "// Name: NY Zoom Punch\n// Author: Easel / ShaderClaw \u2014 Shades of New York\n// License: MIT\n// A drop transition: A rushes into the centre with a radial blur, a white flash on the hit,\n// and B punches out from the centre, overshooting slightly before it settles. Bass deepens\n// the punch.\nuniform float amount; // = 0.6\n\nvec4 transition(vec2 uv) {\n  vec2 c = vec2(0.5);\n  float t = progress;\n  float inA = smoothstep(0.0, 0.5, t), outB = smoothstep(0.5, 1.0, t);\n  float zA = 1.0 + inA * inA * 3.0 * amount;\n  float over = 1.0 - (1.0 - outB) * (1.0 - outB);\n  float zB = mix(0.25, 1.0, over) + 0.06 * sin(outB * 9.0) * (1.0 - outB);\n  float punch = 1.0 + audioBass * 0.3;\n  vec3 col = vec3(0.0);\n  float blurA = inA * 0.08 * punch, blurB = (1.0 - outB) * 0.08 * punch;\n  for (int i = 0; i < 8; i++) {\n    float k = float(i) / 7.0;\n    if (t < 0.5) col += getFromColor(c + (uv - c) / (zA * (1.0 + blurA * k))).rgb;\n    else col += getToColor(c + (uv - c) / (zB * (1.0 - blurB * k)) ).rgb;\n  }\n  col /= 8.0;\n  col += vec3(1.0) * exp(-pow((t - 0.5) / 0.06, 2.0)) * 0.9;\n  return vec4(col, 1.0);\n}\n"};

  gl.uniform1f(cutP.loc.amt, cutAmt); gl.uniform1f(cutP.loc.bgMode, cutBg);
  gl.uniform2f(cutP.loc.px, CAM.segA ? 1.5 / CAM.segA.w : 0, CAM.segA ? 1.5 / CAM.segA.h : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}
function updateCut(dt) {
  const want = $("optCut").checked && camLive && !!CAM.segA && haveBody && MV.s.presence > 0.3;
  cutAmt += ((want ? 1 : 0) - cutAmt) * (1 - Math.exp(-dt * 5));
  if (cutAmt < 0.002 && !want) cutAmt = 0;
}
function setCut(on, quiet) {
  $("optCut").checked = on; $("cutBtn").classList.toggle("on", on); $("cutBtn").setAttribute("aria-pressed", String(on)); store.set("cut", on);
  if (!quiet) toast(on ? (CAM.segA ? "Cutout on — the effect lives inside you" : "Cutout on — waits for body tracking") : "Cutout off");
}
$("cutBtn").addEventListener("click", () => setCut(!$("optCut").checked));
$("optCut").addEventListener("change", () => setCut($("optCut").checked, true));
document.querySelectorAll("#cutBg button").forEach(b => {
  b.setAttribute("aria-pressed", String(Number(b.dataset.v) === cutBg));
  b.addEventListener("click", () => { cutBg = Number(b.dataset.v); store.set("cutBg", cutBg); document.querySelectorAll("#cutBg button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
});
setCut(!!store.get("cut", false), true);

// ── render loop ──────────────────────────────────────────────────────────
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  adapt(dt, now);
  if (!cur) return;
  // background-compile the other shaders, one finished program per frame
  for (const id of ORDER) { const P = PROGS[id]; if (P && !P.loc && !P.err && progDone(P)) { finishProgram(P); break; } }
  pollFrames(now);
  updateCamera(dt);
  smoothDisplay(dt);
  updateMoves(dt);
  partMods();
  updateCut(dt);
  updateMoveChip();
  drawOverlays();
  if (!playing) return;
  simTime += dt; audioClock += dt;
  updateAudio(audioClock, dt);
  bodyShow();
  const { prog, loc, meta, targets, vals } = cur;
  gl.useProgram(prog); bindQuad();
  const u1 = (n, x) => { if (loc[n]) gl.uniform1f(loc[n], x); };
  u1("TIME", simTime); u1("TIMEDELTA", dt);
  if (loc.FRAMEINDEX) gl.uniform1i(loc.FRAMEINDEX, frame);
  u1("audioLevel", A.level); u1("audioBass", A.bass); u1("audioMid", A.mid); u1("audioHigh", A.high);
  u1("audioBeatPulse", A.beat); u1("audioBassTime", A.bassTime); u1("audioMidTime", A.midTime); u1("audioHighTime", A.highTime);
  u1("audioEnergy", A.energy); u1("audioBuildup", A.buildup); u1("audioDrop", A.dropOut);
  const demoBeats = audioClock * 122 / 60, tempoOn = audioMode === "demo";
  u1("audioBPM", tempoOn ? 122 : 0); u1("audioBPMConfidence", tempoOn ? 1 : 0);
  u1("audioBeatPhase", tempoOn ? demoBeats % 1 : 0); u1("audioBarPhase", tempoOn ? (demoBeats / 4) % 1 : 0); u1("audioPhase16", tempoOn ? (demoBeats / 16) % 1 : 0);
  const bp = !M.down ? bodyPointer() : null;
  const mx = bp ? bp.x : M.x, my = bp ? bp.y : M.y;
  if (loc.mousePos) gl.uniform2f(loc.mousePos, mx, my);
  if (loc.mouseDelta) gl.uniform2f(loc.mouseDelta, mx - M.px, my - M.py);
  u1("mouseDown", M.down || (bp && bp.down) ? 1 : 0);
  M.px = mx; M.py = my;
  for (const inp of meta.INPUTS || []) {
    const l = loc[inp.NAME]; if (!l || inp.TYPE === "image") continue;
    const v = inp.NAME in MOD ? MOD[inp.NAME] : vals[inp.NAME];
    if (inp.TYPE === "color") gl.uniform4f(l, v[0], v[1], v[2], v[3]);
    else if (inp.TYPE === "bool") gl.uniform1i(l, v ? 1 : 0);
    else gl.uniform1f(l, Number(v));
  }
  const passes = meta.PASSES && meta.PASSES.length ? meta.PASSES : [{}];
  passes.forEach((p, pi) => {
    let unit = 0;
    for (const name in targets) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, targets[name].a.tex); if (loc[name]) gl.uniform1i(loc[name], unit); unit++; }
    for (const name in cur.imports) {
      const im = cur.imports[name];
      gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, im.tex);
      if (loc[name]) gl.uniform1i(loc[name], unit);
      const sz = loc["IMG_SIZE_" + name]; if (sz) gl.uniform2f(sz, im.w || 0, im.h || 0);
      unit++;
    }
    let w = cv.width, h = cv.height;
    if (p.TARGET) { const t = targets[p.TARGET]; gl.bindFramebuffer(gl.FRAMEBUFFER, t.b.fbo); w = t.w; h = t.h; }
    else gl.bindFramebuffer(gl.FRAMEBUFFER, OUT.fbo);
    gl.viewport(0, 0, w, h);
    if (loc.RENDERSIZE) gl.uniform2f(loc.RENDERSIZE, w, h);
    if (loc.PASSINDEX) gl.uniform1i(loc.PASSINDEX, pi);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    if (p.TARGET) { const t = targets[p.TARGET]; const tmp = t.a; t.a = t.b; t.b = tmp; }
  });
  frame++;
  present();
}

// ── UI: dock, panel, collapse, idle hide, fullscreen, keys, touch ────────
let toastT = 0;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }
function setPanel(open) {
  if (open) { $("parts").hidden = true; $("partBtn").classList.remove("on"); }
  $("panel").hidden = !open; $("ctlBtn").classList.toggle("on", open); $("ctlBtn").setAttribute("aria-expanded", String(open));
  if (open) buildControls();
  wake();
}
function setCollapsed(c) {
  $("dock").hidden = c; $("pill").hidden = !c; if (c) setPanel(false);
  store.set("collapsed", c);
}
let idleT = 0;
function wake() {
  document.body.classList.remove("idle"); clearTimeout(idleT);
  idleT = setTimeout(() => { if ($("panel").hidden && $("parts").hidden && $("gate").hidden) document.body.classList.add("idle"); }, 3200);
}
["pointermove", "pointerdown", "keydown"].forEach(e => window.addEventListener(e, wake, { passive: true }));
$("prevSh").addEventListener("click", () => step(-1));
$("nextSh").addEventListener("click", () => step(1));
$("palBtn").addEventListener("click", () => cyclePal(1));
$("ctlBtn").addEventListener("click", () => setPanel($("panel").hidden));
$("hideBtn").addEventListener("click", () => setCollapsed(true));
$("pill").addEventListener("click", () => setCollapsed(false));
$("reset").addEventListener("click", () => { if (!cur) return; const pal = cur.vals.paletteMode; Object.assign(cur.vals, defaults(cur.meta)); if (pal != null) cur.vals.paletteMode = pal; cur.vals.__cam = false; camDefaults(cur.id, cur.vals); buildControls(); });
$("camBtn").addEventListener("click", () => { camLive ? stopCamera() : startCamera(); });
$("camDotBtn").addEventListener("click", () => { if (!camLive) startCamera(); else { $("optPip").checked = !$("optPip").checked; applyPip(); } });
$("gateRetry").addEventListener("click", startCamera);
$("gateSkip").addEventListener("click", () => { $("gate").hidden = true; wake(); });
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
if (!fsOK) $("fsBtn").hidden = true;
function toggleFS() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: "hide" }); if (r && r.catch) r.catch(() => {}); }
}
$("fsBtn").addEventListener("click", toggleFS);
document.addEventListener("fullscreenchange", () => { $("fsBtn").classList.toggle("on", !!document.fullscreenElement); });
$("stage").addEventListener("dblclick", toggleFS);
window.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  const k = e.key;
  if (k === "ArrowRight") step(1); else if (k === "ArrowLeft") step(-1);
  else if (k === "ArrowUp") cyclePal(-1); else if (k === "ArrowDown") cyclePal(1);
  else if (k === "f" || k === "F") toggleFS();
  else if (k === "h" || k === "H") setCollapsed(!$("dock").hidden);
  else if (k === "c" || k === "C") { if ($("dock").hidden) setCollapsed(false); setPanel($("panel").hidden); }
  else if (k === " ") { playing = !playing; toast(playing ? "Playing" : "Paused"); }
  else if (k === "x" || k === "X") setCut(!$("optCut").checked);
  else if (k === "b" || k === "B") setParts($("parts").hidden);
  else if (k >= "1" && k <= String(PART_KEYS.length)) setPart(PART_KEYS[Number(k) - 1]);
  else if (k === "Escape") { setPanel(false); setParts(false); }
  else return;
  e.preventDefault();
});
// stage: drag paints on interactive shaders; a horizontal swipe changes colour; a tap closes the panel
const stageEl = $("stage");
let sw = null;
function setMouse(e) { M.x = clamp(e.clientX / innerWidth, 0, 1); M.y = clamp(1 - e.clientY / innerHeight, 0, 1); }
stageEl.addEventListener("pointermove", setMouse);
stageEl.addEventListener("pointerdown", e => {
  if (!$("panel").hidden || !$("parts").hidden) { setPanel(false); setParts(false); return; }
  if (e.button !== 0 && e.pointerType === "mouse") return;
  setMouse(e); M.px = M.x; M.py = M.y;
  if (paintMode) { M.down = true; try { stageEl.setPointerCapture(e.pointerId); } catch (_) {} }
  sw = { x: e.clientX, y: e.clientY };
});
stageEl.addEventListener("pointerup", e => {
  M.down = false;
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (!paintMode && e.pointerType !== "mouse" && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4) cyclePal(dx < 0 ? 1 : -1);
});
stageEl.addEventListener("pointercancel", () => { M.down = false; sw = null; });

// ── start: full screen stage, camera on straight away ────────────────────
resize();
const startId = (location.hash || "").slice(1) || store.get("shader", ORDER[0]);
load(ORDER.includes(startId) ? startId : ORDER[0]);
for (const id of ORDER) startProgram(id);     // compile the rest in the background
if (store.get("collapsed", false)) setCollapsed(true);
wake();
requestAnimationFrame(tick);
toast("← → shader · ↑ ↓ colour · B body part · X cutout · C controls · H hide · F fullscreen");
startCamera();
</script>
